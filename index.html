<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Akkord-Labor</title>
<meta name="theme-color" content="#0c0e12">
<meta name="color-scheme" content="dark">
<meta name="description" content="Songwriting-Labor: Akkorde, Bass, Drums und Melodie – für Klavier und Gitarre.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Layout: dunkle, ruhige Werkbank – Farbe gehört nur den Noten (12 Töne = 12 Farbtöne) */
:root{color-scheme:dark;--bg:#0c0e12;--s1:#14171c;--s2:#1b1f26;--s3:#242932;--bd:#2a2f38;--bd2:#3a414c;--tx:#e8ebf0;--tx2:#a2a9b4;--tx3:#6c737e;--hi:#f3f5f8;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-text-size-adjust:100%}
body.noscroll{overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;transition:background .12s,border-color .12s}
button:active{transform:scale(.97)}
button svg{width:18px;height:18px;flex:none}
button.pri{background:var(--hi);color:#0c0e12;border-color:var(--hi);font-weight:600}
button.danger{border-color:#5a2a2e;color:#ffb3b8}
button.wide{width:100%}
select{background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;min-height:34px;max-width:100%}
input[type=range]{accent-color:#e8ebf0;width:100%}
input[type=checkbox]{accent-color:#e8ebf0;width:18px;height:18px}
.txt{flex:1;min-width:0;background:var(--s2);border:1px solid var(--bd2);border-radius:10px;padding:9px 12px;font-size:16px}
.hdr{position:sticky;top:0;z-index:20;background:rgba(12,14,18,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);padding:calc(6px + var(--safe-t)) 10px 8px}
.hdr .r1,.hdr .r2{display:flex;align-items:center;gap:6px;max-width:860px;margin:0 auto}
.hdr .r2{margin-top:6px}
.ptitle{flex:1;min-width:0;justify-content:flex-start;background:none;border:0;font-weight:650;font-size:16px;padding:6px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;text-align:left}
.keychip{background:var(--s3);border-color:var(--bd2);border-radius:999px;font-weight:600;font-size:13px;padding:6px 12px;min-height:32px;white-space:nowrap}
.ib{padding:7px;min-width:38px;min-height:38px}
.ib.sm{min-width:30px;min-height:30px;padding:4px}
.ib.on{background:var(--s3);border-color:var(--tx2)}
.ib.pl{border-radius:999px}
.playbtn{width:44px;height:44px;border-radius:999px;background:var(--hi);color:#0c0e12;border:0;padding:0;flex:none}
.playbtn svg{width:20px;height:20px}
.playbtn.on{background:#ff6b6b}
.seg{display:inline-flex;background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:2px;gap:2px;flex:none}
.seg button{background:none;border:0;border-radius:8px;min-height:32px;padding:5px 10px;font-size:13px;color:var(--tx2)}
.seg button.on{background:var(--s3);color:var(--tx);box-shadow:inset 0 0 0 1px var(--bd2)}
.seg.sm button{min-height:28px;padding:4px 8px;font-size:12px}
.seg.inst button{padding:5px 8px}
.seg.inst svg{width:20px;height:20px}
.seg.wide4{display:flex;width:100%}
.seg.wide4 button{flex:1;padding:6px 2px;font-size:12px}
.bpm{display:flex;align-items:center;gap:2px;background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:0 6px;height:38px;margin-left:auto}
.bpm input{width:42px;background:none;border:0;text-align:right;font-weight:650;font-size:15px;-moz-appearance:textfield}
.bpm input::-webkit-inner-spin-button{display:none}
.bpm span{font-size:10px;color:var(--tx3)}
main{padding:12px 12px calc(86px + var(--safe-b));max-width:860px;margin:0 auto}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(17,19,24,.97);border-top:1px solid var(--bd);padding-bottom:var(--safe-b);z-index:30}
.tabs button{flex:1;border:0;background:none;border-radius:0;padding:8px 0 7px;flex-direction:column;gap:3px;font-size:11px;color:var(--tx3);min-height:56px}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--tx)}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.card.pad0{padding:6px}
.card.sec.sel{border-color:var(--bd2);box-shadow:0 0 0 1px var(--bd2)}
.card.asst{background:linear-gradient(0deg,var(--s1),var(--s1));border-style:dashed}
.h{font-weight:650;font-size:16px;display:flex;align-items:center;gap:6px}
.h svg{width:18px;height:18px}
.sub{color:var(--tx2);font-size:13px}
.hint{color:var(--tx3);font-size:12px;margin-top:8px}
.tip{background:var(--s2);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--tx2);margin-top:8px}
.why{color:var(--tx3);font-size:12px;margin-top:6px}
.lbl{font-size:12px;color:var(--tx2);margin:12px 0 6px;font-weight:600;letter-spacing:.2px}
.lbl0{font-size:13px;color:var(--tx2)}
.mt{margin-top:10px}
.pad{padding:0 4px 10px}
.center{text-align:center}
.row{display:flex;align-items:center;gap:8px}
.row.wrap{flex-wrap:wrap}
.row.sp{justify-content:space-between}
.row.g8{gap:10px}.row.g6{gap:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.pill{border-radius:999px;padding:5px 12px;min-height:32px;font-size:13px;background:var(--s2)}
.pill.on{background:var(--hi);color:#0c0e12;border-color:var(--hi);font-weight:600}
.pill.out{border-style:dashed;color:var(--tx2)}
.pill.out.on{color:#0c0e12}
.hscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.secpick{display:flex;gap:6px;padding:2px 0 10px;white-space:nowrap}
.secpick .pill{flex:none}
/* Akkord-Chips */
.crow{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px;margin-top:10px}
.crow.small{margin:0 0 12px}
.cchip{flex-direction:column;align-items:flex-start;justify-content:center;gap:0;min-height:52px;padding:6px 7px;border-radius:10px;background:var(--s2);border:1px solid var(--bd);border-left:4px solid var(--c);text-align:left;overflow:hidden}
.cchip b{font-size:15px;line-height:1.15;max-width:100%;overflow-wrap:anywhere}
.cchip i{font-style:normal;font-size:11px;color:var(--tx2);white-space:nowrap}
.cchip.on{background:var(--s3);border-color:var(--c);box-shadow:0 0 0 1px var(--c)}
.cchip.ph{background:color-mix(in srgb,var(--c) 28%,var(--s2))}
.cchip.add{border:1px dashed var(--bd2);align-items:center;color:var(--tx2)}
.cchip.mini{min-height:38px;flex-direction:row;align-items:center;gap:6px;padding:5px 9px}
.cchip.mini b{font-size:14px}
.cedit{background:var(--s2);border-radius:12px;padding:10px;margin-top:10px;border:1px solid var(--bd)}
.cedit .act{margin-top:12px}
.cedit .wide{margin-top:10px}
.secopts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:12px}
.secopts label{font-size:11px;color:var(--tx3);display:flex;flex-direction:column;gap:3px}
.secopts select{font-size:12px;width:100%}
/* Ablauf */
.arr{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ai{display:flex;align-items:center;background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:0 2px 0 0;min-height:38px}
.ai .grip{touch-action:none;padding:8px 4px 8px 6px;color:var(--tx3);cursor:grab;display:flex}
.ai .grip svg{width:14px;height:14px}
.ai .an{background:none;border:0;padding:6px 4px;min-height:34px;font-size:13px;font-weight:600}
.ai .ax{background:none;border:0;padding:4px;min-height:30px;min-width:26px;color:var(--tx3)}
.ai .ax svg{width:14px;height:14px}
.ai.add{padding:0 10px;color:var(--tx2);border-style:dashed}
.ai.dragging{opacity:.35}
.ai.drop{box-shadow:-3px 0 0 var(--hi)}
.ghost{position:fixed;z-index:100;pointer-events:none;opacity:.92;box-shadow:0 8px 24px rgba(0,0,0,.5)}
/* Mixer */
.mixrow{display:flex;align-items:center;gap:10px;margin-top:10px}
.mixrow .mute{min-width:92px;font-size:13px;min-height:34px}
.mixrow .mute.on{color:#ff8787;border-color:#5a2a2e}
.mixrow .lbl0{min-width:92px}
/* Akkord-Detail */
.big .bigc{text-align:center;flex:1;cursor:pointer}
.big .bn{font-size:40px;font-weight:750;line-height:1.1;letter-spacing:-.5px}
.pianowrap{width:100%}
svg.piano{width:100%;height:auto;display:block}
.pkl{font-size:10px;fill:#0b0d10;font-weight:700;text-anchor:middle;pointer-events:none}
.pkl.sm{font-size:8px}
.pkc{font-size:8px;fill:#8a919c;text-anchor:middle;pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:12px;color:var(--tx2)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.legend small{color:var(--tx3)}
.shape{background:var(--s2);border-radius:10px;padding:8px 10px;font-size:13px;margin-top:8px;color:var(--tx2)}
.shape b{color:var(--tx)}
.gwrap{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px}
.dgm{flex:0 1 230px}
svg.cdiag{width:100%;height:auto;display:block;max-height:280px}
.dx{font-size:16px;fill:#8a919c;text-anchor:middle}
.dn{font-size:10px;font-weight:800;fill:#0b0d10;text-anchor:middle}
.dnb{font-size:11px;font-weight:700;text-anchor:middle}
.dfr{font-size:13px;fill:var(--tx2);text-anchor:end;font-weight:600}
.alts{display:flex;gap:6px;margin-top:10px;padding-bottom:4px}
.alt{flex:none;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;padding:5px 9px;min-height:32px;color:var(--tx2)}
.alt.on{background:var(--s3);color:var(--tx);border-color:var(--tx2)}
.tune{margin-top:12px;font-size:12px;color:var(--tx2)}
.tune label{display:flex;align-items:center;gap:6px}
svg.fb{display:block}
.fbn{font-size:10px;fill:var(--tx3);text-anchor:middle}
.fbs{font-size:11px;fill:var(--tx2);text-anchor:middle;font-weight:600}
.fbl{font-size:9px;font-weight:800;fill:#0b0d10;text-anchor:middle}
.ex{margin-top:10px}
.ex b{font-size:13px}
.ex p{margin:2px 0 0;color:var(--tx2);font-size:14px}
.sugg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.sg{flex-direction:column;align-items:flex-start;gap:1px;text-align:left;border-left:4px solid var(--c);padding:7px 9px;min-height:62px}
.sg b{font-size:15px}
.sg i{font-style:normal;font-size:11px;color:var(--tx2)}
.sg span{font-size:11px;color:var(--tx3);line-height:1.25}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}
.opt:first-of-type{border-top:0}
.opt.col{flex-direction:column;align-items:stretch}
.opt b.big{font-size:22px}
.karow{display:flex;align-items:center;gap:6px;padding:6px 0;border-top:1px solid var(--bd)}
.karow:first-of-type{border-top:0}
.kan{min-width:52px;font-weight:650;font-size:13px}
.kaf{flex:1;text-align:right;font-size:12px;color:var(--tx3)}
.kgrp{margin-top:12px}
.kgrp .kan{margin-bottom:6px}
/* Drums */
.dgrid{display:grid;gap:2px;width:max-content}
.dgrid.fit{width:100%}
.card.dcard{padding:12px 8px}
.dh{font-size:10px;color:var(--tx3);text-align:center;height:16px;line-height:16px}
.dh.beat{color:var(--tx2);font-weight:700}
.dl{min-height:28px;height:28px;padding:0 4px;font-size:11px;border-radius:6px;justify-content:flex-start;background:none;border:0;color:var(--tx2);position:sticky;left:0;z-index:2;background:var(--s1)}
.dc{min-height:28px;height:28px;padding:0;border-radius:5px;background:var(--s2);border:0;min-width:0}
.dc.b4{box-shadow:inset 1px 0 0 var(--bd2)}
.dc.b16{margin-left:4px}
.dc.v1{background:hsl(var(--h) 70% 55% / .38)}
.dc.v2{background:hsl(var(--h) 75% 58% / .8)}
.dc.v3{background:hsl(var(--h) 85% 64%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.75)}
.dc.ph,.mc.ph{outline:2px solid rgba(255,255,255,.55);outline-offset:-2px}
.presetlist{display:grid;gap:6px;margin-top:8px}
.preset{flex-direction:column;align-items:flex-start;text-align:left;gap:2px;padding:9px 11px}
.preset.on{border-color:var(--tx2);background:var(--s3)}
.preset span{font-size:12px;color:var(--tx2)}
.preset i{font-size:11px;color:var(--tx3);font-style:normal}
details summary{cursor:pointer;color:var(--tx2);font-size:13px;padding:6px 0}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:8px}
/* Melodie */
.mgw{max-height:62vh;overflow:auto}
.mgrid{display:grid;gap:1px;width:max-content}
.mlh{position:sticky;left:0;top:0;z-index:3;background:var(--s1)}
.mch{position:sticky;top:0;z-index:2;background:var(--s2);border-bottom:2px solid var(--c);font-size:12px;font-weight:700;padding:4px 6px;white-space:nowrap;overflow:hidden}
.mlab{position:sticky;left:0;z-index:2;background:var(--s1);border:0;border-radius:0;font-size:11px;font-weight:700;min-height:26px;height:26px;padding:0 4px;justify-content:flex-start}
.mc{height:26px;min-height:26px;padding:0;border:0;border-radius:3px;background:#171a20;min-width:0}
.mc.ct{background:#262b34}
.mc.b4{box-shadow:inset 1px 0 0 #2f3540}
.mc.b16{box-shadow:inset 2px 0 0 #4a515c}
.mc.ns,.mc.nc{background:var(--c)}
.mc.ns{border-radius:6px 2px 2px 6px}
.mc.nc{border-radius:2px;opacity:.8}
pre.tab{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.35;background:var(--s2);border-radius:10px;padding:10px;margin:8px 0;color:var(--tx)}
.seq{display:flex;flex-wrap:wrap;gap:4px}
.seq span{border-left:3px solid var(--c);background:var(--s2);border-radius:6px;padding:2px 7px;font-size:12px}
/* Labor */
.results{margin-top:12px}
.rootgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.rootgrid .pill{padding:4px 0}
.prog{border-top:1px solid var(--bd);padding-top:10px;margin-top:10px;display:grid;gap:6px}
.pn{font-weight:600;font-size:14px}
.pchips{display:flex;flex-wrap:wrap;gap:5px}
.pc{border-left:3px solid var(--c);background:var(--s2);border-radius:8px;padding:3px 8px;font-size:13px;font-weight:600}
.pc small{color:var(--tx3);margin-left:3px;font-weight:500}
svg.circle{width:100%;max-width:340px;display:block;margin:6px auto 0}
.cl{font-size:12px;font-weight:800;fill:#0b0d10;text-anchor:middle;pointer-events:none}
.cl.sm{font-size:10px}
.cc{font-size:12px;fill:var(--tx3);text-anchor:middle}
svg.circle g{cursor:pointer}
.tbl{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}
.tbl th{text-align:left;color:var(--tx3);font-weight:600;font-size:11px;padding:4px}
.tbl td{padding:6px 4px;border-top:1px solid var(--bd);vertical-align:top}
.tbl.sm td{font-size:12px}
.rules{margin:8px 0 0;padding-left:18px;color:var(--tx2);font-size:14px}
.rules li{margin-bottom:6px}
.rules b{color:var(--tx)}
/* Sheets */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg.in{animation:fade .15s}
.sheet{background:var(--s1);border:1px solid var(--bd);border-bottom:0;border-radius:20px 20px 0 0;width:100%;max-width:860px;max-height:90vh;overflow:auto;padding:12px 14px calc(18px + var(--safe-b))}
.sheet.in{animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;position:sticky;top:-12px;background:var(--s1);padding:6px 0;z-index:3}
.sh-h b{font-size:17px}
.pickinfo{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.pickinfo span{border-left:3px solid var(--c);background:var(--s2);border-radius:6px;padding:2px 7px;font-size:12px;font-weight:600}
.modelist{display:grid;gap:6px}
.mode{flex-direction:column;align-items:flex-start;text-align:left;gap:1px;padding:9px 12px}
.mode.on{background:var(--hi);color:#0c0e12}
.mode.on span{color:#30353d}
.mode span{font-size:12px;color:var(--tx2)}
.moodgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mood{flex-direction:column;align-items:flex-start;text-align:left;gap:1px;padding:8px 10px}
.mood span{font-size:11px;color:var(--tx2)}
.mood.on{background:var(--hi);color:#0c0e12}
.mood.on span{color:#30353d}
.gen{background:var(--s2);border-radius:14px;padding:10px 12px}
.gp{padding:8px 0;border-top:1px solid var(--bd)}
.gpn{font-weight:650;font-size:13px;margin-bottom:4px}
.gp .pc{background:var(--s3)}
.liblist{display:grid;gap:6px}
.libitem{display:flex;align-items:center;gap:6px}
.libopen{flex:1;flex-direction:column;align-items:flex-start;text-align:left;gap:1px;min-width:0}
.libopen b{max-width:100%;overflow-wrap:anywhere}
.libopen span{font-size:12px;color:var(--tx2)}
.libitem.on .libopen{border-color:var(--tx2);background:var(--s3)}
label.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;min-height:38px;cursor:pointer}
label.btn svg{width:18px;height:18px}
.toast{position:fixed;left:50%;bottom:calc(74px + var(--safe-b));transform:translate(-50%,20px);background:var(--hi);color:#0c0e12;padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:200;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:380px){.seg button{padding:5px 8px}.hdr .r2{gap:4px}.keychip{padding:6px 9px;font-size:12px}}
@media (min-width:700px){.sugg{grid-template-columns:repeat(3,minmax(0,1fr))}.crow{grid-template-columns:repeat(16,minmax(0,1fr))}.moodgrid{grid-template-columns:repeat(3,1fr)}}

.h,.sh-h b{text-wrap:balance}
.bpm input,.sub,.tbl td{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid #f3f5f8;outline-offset:2px}
button:focus:not(:focus-visible){outline:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

svg.emo{width:100%;max-width:440px;display:block;margin:10px auto 0}
svg.emo .en{cursor:pointer}
.et{font-size:11px;font-weight:800;fill:#0b0d10;text-anchor:middle;pointer-events:none}
.et.big{font-size:15px}
.el{font-size:12px;fill:var(--tx2);text-anchor:middle;font-weight:600}
.emolist{display:grid;gap:4px;margin-top:8px}
.emorow{justify-content:flex-start;gap:8px;text-align:left;padding:7px 10px;min-height:42px}
.emorow i{width:10px;height:10px;border-radius:50%;flex:none}

<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ===== Musiktheorie-Kern ===== */
const NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const mod12 = n => ((n % 12) + 12) % 12;
const pcName = pc => NOTES[mod12(pc)];
const midiName = m => pcName(m) + (Math.floor(m / 12) - 1);
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

const QUALS = {
  '':      { iv:[0,4,7],          name:'Dur',            feel:'Stabil, hell, klar' },
  'm':     { iv:[0,3,7],          name:'Moll',           feel:'Traurig, ernst, weich' },
  '7':     { iv:[0,4,7,10],       name:'Dominantsept',   feel:'Spannung pur – will sich auflösen' },
  'maj7':  { iv:[0,4,7,11],       name:'Major 7',        feel:'Warm, verträumt, ein bisschen jazzig' },
  'm7':    { iv:[0,3,7,10],       name:'Moll 7',         feel:'Weich, melancholisch, entspannt' },
  'sus2':  { iv:[0,2,7],          name:'sus2',           feel:'Offen, luftig, schwebend' },
  'sus4':  { iv:[0,5,7],          name:'sus4',           feel:'Schwebend – will zurück zur Terz' },
  'add9':  { iv:[0,4,7,14],       name:'add9',           feel:'Glänzend, offen – Indie-Klassiker' },
  'madd9': { iv:[0,3,7,14],       name:'Moll add9',      feel:'Sehnsüchtig, bittersüß' },
  '6':     { iv:[0,4,7,9],        name:'Sexte',          feel:'Nostalgisch, sonnig, retro' },
  'm6':    { iv:[0,3,7,9],        name:'Moll-Sexte',     feel:'Geheimnisvoll, bittersüß' },
  '7sus4': { iv:[0,5,7,10],       name:'7sus4',          feel:'Schwebende Spannung, modern' },
  '9':     { iv:[0,4,7,10,14],    name:'Dominant 9',     feel:'Funky, satte Spannung' },
  'maj9':  { iv:[0,4,7,11,14],    name:'Major 9',        feel:'Sehr verträumt, Neo-Soul' },
  'm9':    { iv:[0,3,7,10,14],    name:'Moll 9',         feel:'Samtig, melancholisch, Lo-Fi' },
  'm11':   { iv:[0,3,7,10,14,17], name:'Moll 11',        feel:'Weit, schwebend, modern' },
  '6/9':   { iv:[0,4,7,9,14],     name:'6/9',            feel:'Schimmernd, entspannt' },
  'mMaj7': { iv:[0,3,7,11],       name:'Moll-Major 7',   feel:'Düster, filmisch' },
  'dim':   { iv:[0,3,6],          name:'vermindert',     feel:'Instabil, unheimlich – Durchgangsakkord' },
  'dim7':  { iv:[0,3,6,9],        name:'vermindert 7',   feel:'Dramatisch, Stummfilm-Spannung' },
  'm7b5':  { iv:[0,3,6,10],       name:'halbvermindert', feel:'Traurig und gespannt zugleich' },
  'aug':   { iv:[0,4,8],          name:'übermäßig',      feel:'Traumartig, ungelöst' },
  '5':     { iv:[0,7],            name:'Powerchord',     feel:'Roh, neutral – weder Dur noch Moll' },
};
const QUAL_KEYS = Object.keys(QUALS);
const QUAL_BY_SET = {};
for (const q of QUAL_KEYS) {
  const k = [...new Set(QUALS[q].iv.map(mod12))].sort((a,b)=>a-b).join(',');
  if (!(k in QUAL_BY_SET)) QUAL_BY_SET[k] = q;
}

const ALIAS = {
  '':'', 'maj':'', 'M':'', 'major':'', 'dur':'',
  'm':'m', 'min':'m', 'mi':'m', '-':'m', 'minor':'m', 'moll':'m',
  '7':'7', 'dom7':'7',
  'maj7':'maj7', 'M7':'maj7', 'Δ':'maj7', 'Δ7':'maj7', 'ma7':'maj7', 'j7':'maj7',
  'm7':'m7', 'min7':'m7', '-7':'m7', 'mi7':'m7',
  'mmaj7':'mMaj7', 'mM7':'mMaj7', 'minmaj7':'mMaj7', 'mMaj7':'mMaj7',
  '6':'6', 'm6':'m6', 'min6':'m6',
  'sus2':'sus2', '2':'sus2', 'sus4':'sus4', 'sus':'sus4', '4':'sus4',
  '7sus4':'7sus4', '7sus':'7sus4',
  'add9':'add9', 'add2':'add9', '2add':'add9',
  'madd9':'madd9', 'madd2':'madd9', 'm2':'madd9',
  '6/9':'6/9', '69':'6/9',
  '9':'9', 'maj9':'maj9', 'M9':'maj9', 'm9':'m9', 'min9':'m9',
  'm11':'m11', 'min11':'m11',
  'dim':'dim', '°':'dim', 'o':'dim', 'dim7':'dim7', '°7':'dim7', 'o7':'dim7',
  'm7b5':'m7b5', 'ø':'m7b5', 'ø7':'m7b5', 'min7b5':'m7b5', 'm7-5':'m7b5',
  'aug':'aug', '+':'aug', '#5':'aug',
  '5':'5',
};
function normQual(x) {
  if (x in ALIAS) return ALIAS[x];
  const y = x.replace(/[()]/g, '');
  if (y in ALIAS) return ALIAS[y];
  const lower = y.toLowerCase();
  if (/^maj/.test(lower) && lower in ALIAS) return ALIAS[lower];
  if (y.length > 1 && lower in ALIAS && !/^M[^a]/.test(y)) return ALIAS[lower];
  return null;
}
/** "bm7", "Asus4", "C#m/G#", "Bbmaj7" -> {r,q,b} (immer mit # dargestellt) */
function parseChord(input) {
  if (!input) return null;
  const s = String(input).trim().replace(/♯/g,'#').replace(/♭/g,'b').replace(/\s+/g,'');
  const m = s.match(/^([A-Ga-g])(#|b)?(.*)$/);
  if (!m) return null;
  let r = NOTES.indexOf(m[1].toUpperCase());
  if (m[2] === '#') r++; else if (m[2] === 'b') r--;
  let rest = m[3] || '', b = null;
  const sl = rest.match(/^(.*)\/([A-Ga-g])(#|b)?$/);
  if (sl) { rest = sl[1]; b = NOTES.indexOf(sl[2].toUpperCase()) + (sl[3]==='#'?1:sl[3]==='b'?-1:0); }
  const q = normQual(rest);
  if (q == null) return null;
  return { r: mod12(r), q, b: b == null ? null : mod12(b) };
}
const chordSym = c => pcName(c.r) + c.q + (c.b != null && c.b !== c.r ? '/' + pcName(c.b) : '');
const chordKey = c => c.r + '|' + c.q + '|' + (c.b == null || c.b === c.r ? '' : c.b);
function chordPcs(c) {
  const s = [...new Set(QUALS[c.q].iv.map(i => mod12(c.r + i)))];
  if (c.b != null && !s.includes(c.b)) s.push(c.b);
  return s;
}
const subset = (a, b) => a.every(x => b.includes(x));
const isMinorQ = q => { const iv = QUALS[q].iv; return iv.includes(3) && !iv.includes(4); };

/* ---- Tonarten & Skalen ---- */
const MODES = {
  major:        { name:'Major',          iv:[0,2,4,5,7,9,11], minor:false, color:'Hell, stabil, fröhlich' },
  minor:        { name:'Minor',          iv:[0,2,3,5,7,8,10], minor:true,  color:'Traurig, ernst, melancholisch' },
  dorian:       { name:'Dorian',         iv:[0,2,3,5,7,9,10], minor:true,  color:'Moll mit Lichtblick (große Sexte)' },
  phrygian:     { name:'Phrygian',       iv:[0,1,3,5,7,8,10], minor:true,  color:'Dunkel, spanisch (kleine Sekunde)' },
  lydian:       { name:'Lydian',         iv:[0,2,4,6,7,9,11], minor:false, color:'Magisch, schwebend (übermäßige Quarte)' },
  mixolydian:   { name:'Mixolydian',     iv:[0,2,4,5,7,9,10], minor:false, color:'Rockig, entspannt (kleine Septime)' },
  harmonicMinor:{ name:'Harmonic Minor', iv:[0,2,3,5,7,8,11], minor:true,  color:'Dramatisch, orientalisch (Leitton)' },
};
const MODE_KEYS = Object.keys(MODES);
const EXTRA_SCALES = {
  majorPent: { name:'Major Pentatonic', iv:[0,2,4,7,9] },
  minorPent: { name:'Minor Pentatonic', iv:[0,3,5,7,10] },
  blues:     { name:'Blues',            iv:[0,3,5,6,7,10] },
};
const ALL_SCALES = Object.assign({}, MODES, EXTRA_SCALES);
const scalePcs = (root, mode) => ALL_SCALES[mode].iv.map(i => mod12(root + i));
const keyName = key => pcName(key.root) + ' ' + MODES[key.mode].name;
const scaleName = (root, mode) => pcName(root) + ' ' + ALL_SCALES[mode].name;

function diatonicChord(key, deg, size) {
  const sc = MODES[key.mode].iv, base = sc[deg], rel = [];
  for (let k = 0; k < size; k++) rel.push(mod12(sc[(deg + 2*k) % 7] - base));
  const set = [...new Set(rel)].sort((a,b)=>a-b).join(',');
  let q = QUAL_BY_SET[set];
  if (q == null) q = QUAL_BY_SET[[...new Set(rel.slice(0,3))].sort((a,b)=>a-b).join(',')] || '';
  return { r: mod12(key.root + base), q, b: null };
}

const ROMAN = ['I','II','III','IV','V','VI','VII'];
function degreeOf(pc, key) {
  const rel = mod12(pc - key.root), sc = MODES[key.mode].iv;
  const d = sc.indexOf(rel);
  if (d >= 0) return { deg:d, acc:'' };
  const up = sc.indexOf(mod12(rel + 1)), dn = sc.indexOf(mod12(rel - 1));
  if (rel === 1 && up >= 0) return { deg:up, acc:'♭' };
  if (rel === 6 && dn >= 0) return { deg:dn, acc:'#' };
  if (MODES[key.mode].minor) return dn >= 0 ? { deg:dn, acc:'#' } : { deg:up, acc:'♭' };
  return up >= 0 ? { deg:up, acc:'♭' } : { deg:dn, acc:'#' };
}
function numeral(c, key) {
  const { deg, acc } = degreeOf(c.r, key);
  let n = ROMAN[deg], suf = '';
  const q = c.q;
  if (q === 'dim') { n = n.toLowerCase(); suf = '°'; }
  else if (q === 'dim7') { n = n.toLowerCase(); suf = '°7'; }
  else if (q === 'm7b5') { n = n.toLowerCase(); suf = 'ø7'; }
  else if (q === 'aug') suf = '+';
  else if (isMinorQ(q)) { n = n.toLowerCase(); suf = q.replace(/^m/, ''); if (suf === 'Maj7') suf = 'maj7'; }
  else suf = q;
  let s = acc + n + suf;
  if (c.b != null && c.b !== c.r) s += '/' + pcName(c.b);
  return s;
}
function harmonicFunction(c, key) {
  const { deg, acc } = degreeOf(c.r, key);
  const minorKey = MODES[key.mode].minor;
  const iv = QUALS[c.q].iv;
  if (acc === '') {
    if (deg === 0) return { f:'T', label:'Tonika – Heimat, Ruhe, Ankommen' };
    if (deg === 4) return (iv.includes(4) || /sus/.test(c.q)) ? { f:'D', label:'Dominante – Spannung, will nach Hause' } : { f:'D', label:'Moll-Dominante – sanfte, traurige Spannung' };
    if (deg === 3 || deg === 1) return { f:'S', label:'Subdominante – Aufbruch, weg von zu Hause' };
    if (deg === 5) return { f:'T', label: minorKey ? 'Tonika-Verwandter (VI) – warm, ein Lichtblick' : 'Tonika-Verwandter (vi) – melancholisch' };
    if (deg === 2) return { f:'T', label: minorKey ? 'Paralleldur (III) – hell, hoffnungsvoll' : 'Mediante (iii) – zart, schwebend' };
    if (deg === 6) return minorKey ? { f:'D', label:'Subtonika (VII) – zieht zur III oder zurück zur i' } : { f:'D', label:'Leitton-Akkord – sehr instabil' };
  }
  if ((c.q === '7' || c.q === '9') ) return { f:'X', label:'Zwischendominante – zieht zu ' + pcName(c.r + 5) };
  return { f:'X', label:'Farbakkord – kommt von außerhalb der Tonart' };
}
const FN_SHORT = { T:'Ruhe', S:'Aufbruch', D:'Spannung', X:'Farbe' };

/* ---- Akkord-Pool: diatonisch, fancy, geliehen, Zwischendominanten ---- */
const BORROW_FROM = {
  major:['mixolydian','minor','dorian','lydian','harmonicMinor'],
  minor:['dorian','harmonicMinor','major','phrygian'],
  dorian:['minor','major','mixolydian'],
  phrygian:['minor','harmonicMinor','dorian'],
  lydian:['major','mixolydian','minor'],
  mixolydian:['major','minor','dorian'],
  harmonicMinor:['minor','major','dorian'],
};
const FANCY_QS = ['add9','maj7','6','sus2','sus4','maj9','6/9','7','9','7sus4','m7','madd9','m9','m11','m6','mMaj7'];
const _poolCache = {};
function chordPool(key) {
  const ck = key.root + key.mode;
  if (_poolCache[ck]) return _poolCache[ck];
  const sc = scalePcs(key.root, key.mode), out = [], seen = new Set();
  const add = (c, cat, extra) => { const k = chordKey(c); if (seen.has(k)) return; seen.add(k); out.push(Object.assign({ c, cat }, extra || {})); };
  for (let d = 0; d < 7; d++) add(diatonicChord(key, d, 3), 'diatonic', { deg:d });
  for (let d = 0; d < 7; d++) add(diatonicChord(key, d, 4), 'diatonic7', { deg:d });
  for (let d = 0; d < 7; d++) {
    const r = mod12(key.root + MODES[key.mode].iv[d]);
    for (const q of FANCY_QS) { const c = { r, q, b:null }; if (subset(chordPcs(c), sc)) add(c, 'fancy', { deg:d }); }
  }
  for (const m of (BORROW_FROM[key.mode] || [])) {
    const k2 = { root:key.root, mode:m };
    for (let d = 0; d < 7; d++) for (const size of [3, 4]) {
      const c = diatonicChord(k2, d, size);
      if (!subset(chordPcs(c), sc)) add(c, 'borrowed', { from:m });
    }
  }
  for (let d = 1; d < 7; d++) {
    const t = diatonicChord(key, d, 3);
    if (t.q === 'dim' || t.q === 'aug') continue;
    add({ r:mod12(t.r + 7), q:'7', b:null }, 'secdom', { target:t });
  }
  return (_poolCache[ck] = out);
}
function borrowPrior(c, key) {
  const rel = mod12(c.r - key.root), k = rel + ':' + c.q;
  const MAJ = { '5:m':2, '8:':2, '10:':2, '3:':1.5, '5:m7':1.6, '8:maj7':1.6, '10:7':1.1, '2:m7b5':0.9, '7:m':0.8, '0:m':0.5 };
  const MIN = { '5:':2, '7:':2, '7:7':2.2, '0:':1, '2:m':1.2, '2:m7':1.2, '1:':1.4, '1:maj7':1.2, '5:7':1.1, '11:dim7':1.3, '9:m7b5':0.8 };
  return ((MODES[key.mode].minor ? MIN : MAJ)[k]) || 0.3;
}
function findSourceMode(c, key) {
  for (const m of (BORROW_FROM[key.mode] || [])) if (subset(chordPcs(c), scalePcs(key.root, m))) return m;
  return null;
}
const BORROW_STORY = {
  major:'bringt Dur-Licht in die Moll-Welt',
  minor:'wirft einen Moll-Schatten auf Dur – klingt sehnsüchtig',
  dorian:'die große Sexte gibt dem Moll einen hoffnungsvollen Twist',
  mixolydian:'die kleine Septime klingt rockig und entspannt',
  phrygian:'die kleine Sekunde klingt dunkel, fast spanisch',
  lydian:'die übermäßige Quarte klingt magisch und schwebend',
  harmonicMinor:'der Leitton erzeugt starken Zug zurück zur Tonika',
};

const MOTION = {
  0:[0.4,'Gleicher Grundton – nur die Farbe ändert sich'],
  1:[0.6,'Grundton einen Halbton hoch – chromatischer Ruck'],
  2:[1.4,'Grundton einen Ganzton hoch – schiebt nach vorn'],
  3:[1.2,'Grundton eine kleine Terz hoch – teilt Töne, weich'],
  4:[1.0,'Grundton eine große Terz hoch – auffälliger Farbwechsel'],
  5:[2.4,'Quintfall – der natürlichste Schritt in der Musik'],
  6:[0.2,'Tritonus-Sprung – maximal fremd'],
  7:[1.0,'Quintstieg – öffnet, wirkt wie Aufbruch'],
  8:[1.3,'Grundton eine große Terz runter – filmisch'],
  9:[1.4,'Grundton eine kleine Terz runter – sehr weich'],
  10:[1.4,'Grundton einen Ganzton runter – sinkt angenehm'],
  11:[0.9,'Grundton einen Halbton runter – gleitet'],
};

/** Vorschläge für den nächsten Akkord */
function suggestNext(prev, key, prev2) {
  const pool = chordPool(key), res = [];
  for (const p of pool) {
    const c = p.c;
    if (prev && chordKey(c) === chordKey(prev)) continue;
    let s = { diatonic:3, diatonic7:2.6, fancy:2.0, borrowed:0.8, secdom:0.6 }[p.cat];
    const why = [];
    if (p.cat === 'borrowed') s += borrowPrior(c, key);
    const dc = degreeOf(c.r, key);
    if (!prev) {
      if (dc.acc === '' && dc.deg === 0) { s += 4; why.push('Start auf der Tonika – klare Heimat'); }
      else if (dc.acc === '' && (dc.deg === 5 || dc.deg === 3)) { s += 1.5; why.push('Start abseits der Tonika – spannender Einstieg'); }
    } else {
      const mv = mod12(c.r - prev.r);
      s += MOTION[mv][0]; why.push(MOTION[mv][1]);
      const ct = chordPcs(c).filter(x => chordPcs(prev).includes(x)).length;
      s += ct * 0.5;
      if (ct >= 2) why.push(ct + ' gemeinsame Töne – sanfter Übergang');
      const fp = harmonicFunction(prev, key).f, fc = harmonicFunction(c, key).f;
      if (fp === 'D' && dc.acc === '' && dc.deg === 0) { s += 3; why.unshift('Auflösung: Spannung → Heimat'); }
      if (fp === 'D' && dc.acc === '' && dc.deg === 5) { s += 1.4; why.unshift('Trugschluss – statt heim überraschend woanders hin'); }
      if (fp === 'S' && fc === 'D') { s += 1.2; why.push('Subdominante → Dominante: baut Spannung auf'); }
      if (fp === 'T' && fc === 'S') s += 0.6;
      if ((prev.q === '7' || prev.q === '9') && c.r === mod12(prev.r + 5)) { s += 3; why.unshift('Der Septakkord löst sich eine Quinte tiefer auf'); }
      if (/sus/.test(prev.q) && c.r === prev.r && (QUALS[c.q].iv.includes(3) || QUALS[c.q].iv.includes(4))) { s += 3.5; why.unshift('Vorhalt löst sich auf – die Terz kommt'); }
      if (prev2 && chordKey(c) === chordKey(prev2)) s -= 0.8;
    }
    if (p.cat === 'secdom') why.push('Zwischendominante → zieht zu ' + chordSym(p.target));
    if (p.cat === 'borrowed') why.push('Geliehen aus ' + pcName(key.root) + ' ' + MODES[p.from].name);
    res.push({ c, s, why, cat:p.cat, from:p.from });
  }
  res.sort((a, b) => b.s - a.s);
  return res;
}

/** Varianten eines Akkords (gleicher Grundton) */
function variantsFor(c, key) {
  const iv = QUALS[c.q].iv;
  let fam;
  if (c.q === 'dim' || c.q === 'dim7' || c.q === 'm7b5') fam = ['dim','m7b5','dim7','m'];
  else if (c.q === 'aug') fam = ['aug','','maj7','7'];
  else if (iv.includes(3) && !iv.includes(4)) fam = ['m','m7','madd9','m9','m6','m11','mMaj7','sus2','sus4',''];
  else fam = ['','add9','maj7','7','sus2','sus4','6','maj9','6/9','7sus4','9','m'];
  const sc = scalePcs(key.root, key.mode);
  return fam.map(q => ({ q, inKey: subset(chordPcs({ r:c.r, q, b:null }), sc) }));
}

/* ---- Erklärungen ---- */
const IV_NAMES = { 0:'Prime', 1:'kleine Sekunde', 2:'große Sekunde', 3:'kleine Terz', 4:'große Terz', 5:'Quarte', 6:'Tritonus', 7:'Quinte', 8:'kleine Sexte', 9:'große Sexte', 10:'kleine Septime', 11:'große Septime' };
const TONE_ROLE = { 0:'Grundton', 2:'Sekunde', 3:'kleine Terz', 4:'große Terz', 5:'Quarte', 6:'verm. Quinte', 7:'Quinte', 8:'überm. Quinte', 9:'Sexte', 10:'kleine Septime', 11:'große Septime', 14:'None', 17:'Undezime' };
function colorDetail(c) {
  const r = c.r;
  switch (c.q) {
    case 'maj7': return `Die große Septime ${pcName(r+11)} liegt nur einen Halbton unter dem Grundton – diese sanfte Reibung macht den Klang verträumt.`;
    case 'm7': return `Die kleine Septime ${pcName(r+10)} nimmt dem Moll die Schwere – weicher, weniger endgültig.`;
    case '7': return `Zwischen Terz ${pcName(r+4)} und Septime ${pcName(r+10)} liegt ein Tritonus – maximale Spannung, die nach ${pcName(r+5)} drängt.`;
    case 'sus4': return `Die Quarte ${pcName(r+5)} ersetzt die Terz: weder Dur noch Moll. Das Ohr wartet, dass sie zur Terz fällt.`;
    case 'sus2': return `Die Sekunde ${pcName(r+2)} ersetzt die Terz – damit fällt die Dur/Moll-Entscheidung weg.`;

/** Tab für eine einstimmige Melodie (DP über Saite/Bund) */
function melodyTab(notes, open) {
  const ns = notes.slice().sort((a, b) => a.s - b.s);
  if (!ns.length) return { pos: [], text: '' };
  const cands = ns.map(n => {
    const c = [];
    for (let s = 0; s < 6; s++) { const f = n.m - open[s]; if (f >= 0 && f <= 15) c.push({ s, f }); }
    return c;
  });
  const cost = [], back = [];
  cands.forEach((cs, i) => {
    cost[i] = []; back[i] = [];
    cs.forEach((c, j) => {
      const base = (c.f > 12 ? 2.0 : 0) + (c.f > 9 ? 0.5 : 0);
      if (i === 0 || !cands[i - 1].length) { cost[i][j] = base + c.f * 0.05; back[i][j] = -1; return; }
      let best = 1e9, bk = 0;
      cands[i - 1].forEach((p, k) => {
        if (cost[i - 1][k] == null) return;
        const df = Math.abs((c.f || p.f) - (p.f || c.f));
        const t = cost[i - 1][k] + (df <= 3 ? df * 0.25 : 1 + (df - 3)) + Math.abs(c.s - p.s) * 0.3;
        if (t < best) { best = t; bk = k; }
      });
      cost[i][j] = best + base; back[i][j] = bk;
    });
  });
  const pos = new Array(ns.length);
  let li = ns.length - 1;
  while (li >= 0 && !cands[li].length) { pos[li] = null; li--; }
  if (li >= 0) {
    let j = cost[li].indexOf(Math.min(...cost[li].filter(x => x != null)));
    for (let i = li; i >= 0; i--) {
      if (!cands[i].length) { pos[i] = null; continue; }
      pos[i] = cands[i][j];
      j = back[i][j] >= 0 ? back[i][j] : 0;
    }
  }
  // Text-Tab: 1 Zeichen pro 16tel, 2 Takte pro Zeile
  const total = Math.max(16, Math.ceil(Math.max(...ns.map(n => n.s + n.l)) / 16) * 16);
  const lines = [5,4,3,2,1,0].map(() => new Array(total).fill('-'));
  ns.forEach((n, i) => {
    const p = pos[i]; if (!p) return;
    const row = 5 - p.s, txt = String(p.f);
    for (let k = 0; k < txt.length && n.s + k < total; k++) lines[row][n.s + k] = txt[k];
  });
  const names = [5,4,3,2,1,0].map(s => pcName(open[s]).padEnd(2, ' '));
  let out = '';
  for (let start = 0; start < total; start += 32) {
    for (let r = 0; r < 6; r++) {
      let l = names[r] + '|';
      for (let st = start; st < Math.min(total, start + 32); st++) { l += lines[r][st]; if ((st + 1) % 16 === 0) l += '|'; }
      out += l + '\n';
    }
    out += '\n';
  }
  return { pos, text: out.trimEnd() };
}

    else if (mod12(m) === 0) s += `<text x="${x + W / 2}" y="${H - 8}" class="pkc">C${Math.floor(m / 12) - 1}</text>`;
  });
  whites.forEach((m, i) => {
    const b = m + 1;
    if (b > to || !isBlack(b)) return;
    const mk = marks.get(b), x = (i + 1) * W - BW / 2;
    s += `<rect x="${x}" y="0.5" width="${BW}" height="${BH}" rx="2" fill="${mk ? mk.color : '#1b1e24'}" stroke="#0d0f13" ${click(b)}/>`;
    if (mk && mk.label) s += `<text x="${x + BW / 2}" y="${BH - 7}" class="pkl sm">${esc(mk.label)}</text>`;
  });
  return s + '</svg>';
}

/* ---- Gitarren-Griffbild ---- */
function chordDiagramSVG(frets, open, c) {
  const fv = frets.filter(f => f > 0);
  const maxF = fv.length ? Math.max(...fv) : 0, minF = fv.length ? Math.min(...fv) : 0;
  const start = maxF <= 4 ? 1 : minF, rows = Math.max(4, maxF - start + 1);
  const SX = 30, SP = 24, TOP = 36, FH = 28, W = SX * 2 + SP * 5, H = TOP + rows * FH + 30;
  let s = `<svg class="cdiag" viewBox="0 0 ${W} ${H}">`;
  for (let r = 0; r <= rows; r++) {
    const y = TOP + r * FH, nut = r === 0 && start === 1;
    s += `<line x1="${SX}" y1="${y}" x2="${SX + SP * 5}" y2="${y}" stroke="${nut ? '#e9ecef' : '#4a515c'}" stroke-width="${nut ? 5 : 1.4}"/>`;
  }
  for (let i = 0; i < 6; i++) { const x = SX + i * SP; s += `<line x1="${x}" y1="${TOP}" x2="${x}" y2="${TOP + rows * FH}" stroke="#8a919c" stroke-width="${0.9 + (5 - i) * 0.25}"/>`; }
  if (start > 1) s += `<text x="${SX - 10}" y="${TOP + FH * 0.66}" class="dfr">${start}</text>`;
  // Barré
  if (fv.length >= 4) {
    const bs = frets.map((f, i) => f === minF ? i : -1).filter(i => i >= 0);
    if (bs.length >= 2) {
      const first = bs[0], last = 5;
      let ok = true; for (let i = first; i <= last; i++) if (frets[i] < minF) ok = false;
      if (ok && bs.length >= 2 && minF > 0) { const y = TOP + (minF - start + 0.5) * FH; s += `<rect x="${SX + first * SP - 11}" y="${y - 11}" width="${(last - first) * SP + 22}" height="22" rx="11" fill="#3a404b"/>`; }
    }
  }
  for (let i = 0; i < 6; i++) {
    const f = frets[i], x = SX + i * SP, note = f >= 0 ? open[i] + f : null;
    if (f < 0) s += `<text x="${x}" y="${TOP - 11}" class="dx">×</text>`;
    else if (f === 0) s += `<circle cx="${x}" cy="${TOP - 16}" r="7" fill="none" stroke="${noteColor(mod12(note), c)}" stroke-width="2.4"/>`;
    else { const y = TOP + (f - start + 0.5) * FH; s += `<circle cx="${x}" cy="${y}" r="10.5" fill="${noteColor(mod12(note), c)}"/><text x="${x}" y="${y + 3.8}" class="dn">${pcName(note)}</text>`; }
    if (note != null) s += `<text x="${x}" y="${TOP + rows * FH + 20}" class="dnb" fill="${noteColor(mod12(note), c)}">${pcName(note)}</text>`;
  }
  return s + '</svg>';
}

/* ---- Griffbrett ---- */
function fretboardSVG(open, marks, opts) {
  opts = opts || {};
  const frets = opts.frets || 15, L = 44, FW = opts.fw || 40, TOP = 16, SH = 23;
  const W = L + frets * FW + 8, H = TOP + 5 * SH + 30;
  let s = `<svg class="fb" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  s += `<rect x="${L}" y="${TOP - 8}" width="${frets * FW}" height="${5 * SH + 16}" fill="#191c22" rx="3"/>`;
  [3, 5, 7, 9, 15].forEach(f => { if (f <= frets) s += `<circle cx="${L + (f - 0.5) * FW}" cy="${TOP + 2.5 * SH}" r="4.5" fill="#2e333c"/>`; });
  if (frets >= 12) { s += `<circle cx="${L + 11.5 * FW}" cy="${TOP + 1.5 * SH}" r="4.5" fill="#2e333c"/><circle cx="${L + 11.5 * FW}" cy="${TOP + 3.5 * SH}" r="4.5" fill="#2e333c"/>`; }
  for (let f = 0; f <= frets; f++) {
    const x = L + f * FW;
    s += `<line x1="${x}" y1="${TOP - 8}" x2="${x}" y2="${TOP + 5 * SH + 8}" stroke="${f === 0 ? '#d0d4da' : '#4a515c'}" stroke-width="${f === 0 ? 4 : 1.5}"/>`;
    if (f > 0) s += `<text x="${x - FW / 2}" y="${H - 6}" class="fbn">${f}</text>`;
  }
  for (let si = 0; si < 6; si++) {
    const y = TOP + (5 - si) * SH;
    s += `<line x1="${L}" y1="${y}" x2="${L + frets * FW}" y2="${y}" stroke="#9aa1ab" stroke-width="${0.8 + si * 0.3}"/>`;
    s += `<text x="10" y="${y + 4}" class="fbs">${pcName(open[si])}</text>`;
  }
  if (opts.click) for (let si = 0; si < 6; si++) for (let f = 0; f <= frets; f++) {
    const y = TOP + (5 - si) * SH, x = f === 0 ? 20 : L + (f - 1) * FW, w = f === 0 ? L - 20 : FW;
    s += `<rect x="${x}" y="${y - SH / 2}" width="${w}" height="${SH}" fill="transparent" data-a="${opts.click}" data-s="${si}" data-f="${f}"/>`;
  }
  marks.forEach(mk => {
    const y = TOP + (5 - mk.s) * SH, x = mk.f === 0 ? L - 12 : L + (mk.f - 0.5) * FW;
    s += `<g pointer-events="none" opacity="${mk.dim ? 0.55 : 1}"><circle cx="${x}" cy="${y}" r="9.5" fill="${mk.color}" ${mk.ring ? 'stroke="#fff" stroke-width="2.2"' : ''}/>`;
    if (mk.label) s += `<text x="${x}" y="${y + 3.6}" class="fbl">${esc(mk.label)}</text>`;
    s += '</g>';
  });
  return s + '</svg>';
}

function explainCard(c, prev, next) {

/* ---------- Gefühle-Karte ---------- */
function emoSVG(key) {
  const { chords, t } = emoChords(key), sel = S.ui.emo.sel, R = 175, A = 43 * Math.PI / 180, N = 240;
  const raw = (L, u) => { const a = L.ang * Math.PI / 180 + A * (1 - 2 * u), r = R * Math.pow(Math.sin(Math.PI * u), 0.55); return [r * Math.cos(a), r * Math.sin(a)]; };
  let curves = '', hi = '', nodes = '', minX = 0, maxX = 0, minY = 0, maxY = 0;
  const P2 = pts => 'M' + pts.map(q => q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' L');
  EMO_LOOPS.forEach(L => {
    const pts = [], cum = [0];
    for (let i = 0; i <= N; i++) { const q = raw(L, i / N); pts.push(q); if (i) cum.push(cum[i - 1] + Math.hypot(q[0] - pts[i - 1][0], q[1] - pts[i - 1][1])); minX = Math.min(minX, q[0]); maxX = Math.max(maxX, q[0]); minY = Math.min(minY, q[1]); maxY = Math.max(maxY, q[1]); }
    const tot = cum[N], idx = k => { const target = tot * k / 7; let i = 0; while (i < N && cum[i] < target) i++; return i; };
    curves += `<path d="${P2(pts)}" fill="none" stroke="#3a404b" stroke-width="6" stroke-linecap="round"/>`;
    const arrow = (from, to) => { const i0 = idx(from), i1 = idx(to), seg = []; const n = Math.round((i1 - i0) * 0.72); for (let i = 0; Math.abs(i) <= Math.abs(n); i += Math.sign(n) || 1) { seg.push(pts[i0 + i]); if (!n) break; } hi += `<path d="${P2(seg)}" fill="none" stroke="${L.col}" stroke-width="4.5" marker-end="url(#ah)"/>`; };
    for (let k = 1; k <= 6; k++) {
      const d = (t + L.step * k) % 7, [x, y] = pts[idx(k)];
      if (sel === d) { arrow(k, k - 1); arrow(k, k + 1); }
      const on = sel === d;
      nodes += `<g data-a="emoTap" data-d="${d}" class="en"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="16" fill="${L.col}" ${on ? 'stroke="#fff" stroke-width="3"' : ''}/><text x="${x.toFixed(1)}" y="${(y + 4).toFixed(1)}" class="et">${esc(emoLabel(chords[d]))}</text></g>`;
    }
    if (sel === t) { arrow(0, 1); arrow(7, 6); }
  });
  const pad = 22;
  const vb = `${(minX - pad).toFixed(0)} ${(minY - pad - 16).toFixed(0)} ${(maxX - minX + pad * 2).toFixed(0)} ${(maxY - minY + pad * 2 + 30).toFixed(0)}`;
  return `<svg class="emo" viewBox="${vb}"><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#fff"/></marker></defs>${curves}${hi}${nodes}
    <g data-a="emoTap" data-d="${t}" class="en"><circle r="23" fill="#e9ecef" stroke="${sel === t ? '#fff' : '#0c0e12'}" stroke-width="${sel === t ? 4 : 3}"/><text y="5" class="et big">${esc(emoLabel(chords[t]))}</text></g>
    <text x="0" y="${(minY - pad - 2).toFixed(0)}" class="el">Terzen</text><text x="${(minX + 20).toFixed(0)}" y="${(maxY + pad + 10).toFixed(0)}" class="el">Quarten</text><text x="${(maxX - 20).toFixed(0)}" y="${(maxY + pad + 10).toFixed(0)}" class="el">Sekunden</text></svg>`;
}

function render() {

  app.innerHTML = hdr() + `<main id="view">${view()}</main>` + tabsBar() + sheetHtml();
  keep.forEach(([k, l, t]) => { const el = document.querySelector(`[data-keep="${k}"]`); if (el) { el.scrollLeft = l; el.scrollTop = t; } });
  document.body.classList.toggle('noscroll', !!S.ui.sheet);
}
function commit(opt) {
  const p = P(); p.updated = Date.now();
  saveSoon();

  if (AU.o) applyMix(AU.o, p);

}
let _toastT = null;
function toast(msg) {
  const t = document.getElementById('toast'); if (!t) return;
  t.textContent = msg; t.classList.add('on');
  clearTimeout(_toastT); _toastT = setTimeout(() => t.classList.remove('on'), 2200);
}
const safeName = s => (String(s || 'song').replace(/[^\wäöüÄÖÜß\- ]+/g, '').trim().replace(/\s+/g, '-') || 'song');
function u8ToB64(u8) { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
async function saveFile(name, data) {
  const ext = name.split('.').pop().toLowerCase();
  if (window.AndroidBridge) {
    const u8 = typeof data === 'string' ? new TextEncoder().encode(data) : data;
    const MIMEA = { json:'application/json', mid:'audio/midi', wav:'audio/wav', zip:'application/zip' };
    const r = window.AndroidBridge.saveFile(name, u8ToB64(u8), MIMEA[ext] || 'application/octet-stream');
    toast(r === 'ok' ? 'Gespeichert in Downloads/Akkord-Labor' : 'Speichern ging nicht');
    return;
  }
  if (inClaude()) {
    let dl = null;
    try { dl = await window.claude.use('downloads'); } catch (e) {}
    if (!dl) { toast('Download ist in dieser Ansicht nicht verfügbar'); return; }
    let fname = name, payload = data;
    if (!['json', 'zip', 'txt', 'csv', 'md', 'html'].includes(ext)) {
      payload = makeZip([{ name, data: typeof data === 'string' ? new TextEncoder().encode(data) : data }]);
      fname = name.replace(/\.[^.]+$/, '') + '.zip';
    }
    try { await dl.save({ filename: fname, data: new Blob([payload]) }); toast('Gespeichert: ' + fname); }
    catch (e) { const code = e && e.code; toast(code === 'declined' ? 'Abgebrochen' : 'Speichern ging nicht (' + (code || 'Fehler') + ')'); }
    return;
  }
  const MIME = { json:'application/json', mid:'audio/midi', wav:'audio/wav', zip:'application/zip' };
  const blob = new Blob([data], { type: MIME[ext] || 'application/octet-stream' });
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast('Download: ' + name);
}

  melCell(el) {

  ringTap(el) { const st = modState(), i = +el.dataset.i, x = chromaRing(st.from)[i]; S.ui.mod.ring = i; hearChord(x.c); render(); },
  modQuick(el) {
    const st = modState(), v = el.dataset.v, m = S.ui.mod, f = st.from;
    if (v === 'rel') { m.root = mod12(f.root + (MODES[f.mode].minor ? 3 : 9)); m.mode = MODES[f.mode].minor ? 'major' : 'minor'; }
    else if (v === 'var') { m.root = f.root; m.mode = MODES[f.mode].minor ? 'major' : 'minor'; }
    else { m.root = mod12(f.root + (+v)); m.mode = f.mode; }
    m.ring = null; render();

  modRoot(el) { S.ui.mod.root = +el.dataset.v; render(); },
  modMethod(el) { S.ui.mod.method = el.dataset.v; render(); },
  modCopy(el) { S.ui.mod.copy = el.dataset.v === '1'; render(); },
  modHear(el) {
    const st = modState(), o = modulationOptions(st.from, st.to).opts.find(x => x.id === el.dataset.v);
    const before = (st.prev && st.prev.chords.length ? st.prev : st.tgt).chords.slice(-2).map(c => Object.assign({}, c, { beats: Math.min(4, c.beats || 4) }));
    const d = semis(st.from, st.to);
    const after = st.tgt.chords.slice(0, 2).map(c => ({ r: mod12(c.r + d), q: c.q, b: c.b == null ? null : mod12(c.b + d), beats: 4 }));
    const s1 = tempSec(before); s1.key = st.prev ? keyOf(st.prev) : st.from;
    const secs = [s1];
    if (o.chords.length) { const s2 = tempSec(o.chords.map(c => Object.assign({}, c))); s2.key = st.to; secs.push(s2); }
    const s3 = tempSec(after.length ? after : [Object.assign({}, tonicChord(st.to), { beats:4 })]); s3.key = st.to; secs.push(s3);
    playTemp(secs);
  },
  modApply() {
    const p = P(), m = S.ui.mod, st = modState(), o = modulationOptions(st.from, st.to).opts.find(x => x.id === m.method) || modulationOptions(st.from, st.to).opts[2];
    const d = semis(st.from, st.to);
    let target = st.tgt;
    if (m.copy) {
      const c = JSON.parse(JSON.stringify(st.tgt)); c.id = uid(); c.melodies.forEach(x => x.id = uid());
      transposeSection(c, d); c.key = Object.assign({}, st.to); c.name = st.tgt.name + ' (' + keyName(st.to) + ')';
      p.sections.splice(p.sections.indexOf(st.tgt) + 1, 0, c); p.arrangement[st.ai] = c.id; target = c;
    } else { transposeSection(st.tgt, d); st.tgt.key = Object.assign({}, st.to); }
    if (o.chords.length) {
      const b = newSection('custom', 'Überleitung → ' + keyName(st.to), o.chords.map(c => Object.assign({}, c)), { bassStyle: target.bassStyle, chordStyle: target.chordStyle });
      b.key = Object.assign({}, st.to); b.why = o.name + ': ' + o.desc;
      b.drums = newDrums((st.prev && st.prev.drums.preset) || target.drums.preset, { fill: 'roll' });
      p.sections.splice(p.sections.indexOf(target), 0, b); p.arrangement.splice(st.ai, 0, b.id);
    }
    target.drums.crash = true;
    m.ai = null; m.root = null; m.mode = null; selectSection(target.id); S.ui.tab = 'song'; commit();
    toast('Modulation nach ' + keyName(st.to) + ' eingebaut');

  finderFret(el) { const f = S.ui.finder, s = +el.dataset.s, fr = +el.dataset.f; f.frets[s] = f.frets[s] === fr ? -1 : fr; const open = tuningOpen(ST().tuning, ST().capo); if (f.frets[s] >= 0) hearNotes([open[s] + fr], 'pluck', 0.6); render(); },
  finderKey(el) { const f = S.ui.finder, m = +el.dataset.m, i = f.keys.indexOf(m); if (i >= 0) f.keys.splice(i, 1); else { f.keys.push(m); hearNotes([m], 'ep', 0.6); } render(); },
  finderClear() { S.ui.finder.frets = [-1,-1,-1,-1,-1,-1]; S.ui.finder.keys = []; render(); },
  finderHear() {
    const f = S.ui.finder, open = tuningOpen(ST().tuning, ST().capo);
    const ms = f.mode === 'guitar' ? f.frets.map((x, i) => x >= 0 ? open[i] + x : null).filter(x => x != null) : f.keys.slice().sort((a, b) => a - b);
    const o = audio(), t = o.ctx.currentTime + 0.03;
    ms.forEach((m, i) => playVoice(o, o.bus.preview, f.mode === 'guitar' ? 'pluck' : 'ep', m, t + i * (f.mode === 'guitar' ? 0.04 : 0.01), 1.4, 0.8));
  },
  fbRoot(el) { S.ui.fb.root = +el.dataset.v; render(); },

  fbReset() { S.ui.fb.root = null; S.ui.fb.mode = null; render(); },
  moodHear(el) { const m = MOODS[+el.dataset.m], pg = m.progs[+el.dataset.p], r = moodKeyRoot(m, pg); playTemp([tempSec(tmplChords(pg.c, r))], { root:r, mode:pg.mode || m.mode }, m.bpm); },
  moodAdd(el) {
    const m = MOODS[+el.dataset.m], pg = m.progs[+el.dataset.p], r = moodKeyRoot(m, pg), p = P();
    const s = newSection('verse', pg.name, tmplChords(pg.c, r), { bassStyle:m.bass });
    s.why = m.label + ': ' + pg.name;
    p.sections.push(s); p.arrangement.push(s.id); selectSection(s.id); S.ui.tab = 'song'; commit(); toast('„' + pg.name + '“ als Teil angelegt');

};
function expScopeObj() {
  if (S.ui.expScope === 'section') { const s = curSec(); if (!s) { toast('Kein Teil gewählt'); return null; } return { type:'section', id:s.id }; }

function expName() { const p = P(); return safeName(p.name) + (S.ui.expScope === 'section' ? '-' + safeName((curSec() || {}).name) : ''); }
function playVoicing() {
  const st = ST(), c = curChord(); if (!c) return;
  const vs = voicingsFor(c, st.tuning, st.capo), v = vs[S.ui.vi[chordKey(c) + st.tuning + st.capo] || 0]; if (!v) return;

/* ---- change / input ---- */
const C = {
  modAi(el) { Object.assign(S.ui.mod, { ai:+el.value, root:null, mode:null }); render(); },
  modMode(el) { const st = modState(); S.ui.mod.root = st.to.root; S.ui.mod.mode = el.value; render(); },
  bpmSet(el) { const v = Math.max(40, Math.min(220, Math.round(+el.value || 90))); P().bpm = v; commit(); },
  chordStyle(el) { secById(el.dataset.id).chordStyle = el.value; commit(); },
  bassStyle(el) { secById(el.dataset.id).bassStyle = el.value; commit(); },
  secDrum(el) { const s = secById(el.dataset.id), d = s.drums; s.drums = newDrums(el.value, { fill:d.fill, crash:d.crash, humanize:d.humanize }); commit(); },
  tuning(el) { ST().tuning = el.value; saveSoon(); render(); },
  capo(el) { ST().capo = +el.value; saveSoon(); render(); },
  drumCrash(el) { curSec().drums.crash = el.checked; commit({ noRender:true }); },
  drumHuman(el) { curSec().drums.humanize = el.checked; commit({ noRender:true }); },
  keyTrans(el) { S.ui.sheet.trans = el.checked; },
  melSound(el) { curSec().melodies[S.ui.melLayer].sound = el.value; commit(); },
  fbMode(el) { S.ui.fb.mode = el.value; render(); },
  importJson(el) {
    const f = el.files && el.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const d = JSON.parse(rd.result);
        const list = d.projects || (d.project ? [d.project] : (d.sections ? [d] : []));
        let n = 0, last = null;
        list.map(migrateProject).filter(Boolean).forEach(p => {
          if (store.projects.some(x => x.id === p.id)) p.id = uid();
          if (store.projects.some(x => x.name === p.name)) p.name += ' (importiert)';
          store.projects.push(p); last = p; n++;
        });
        if (last) openProject(last.id);
        S.ui.sheet = null; commit(); toast(n ? n + ' Song(s) geladen' : 'Keine Songs in der Datei');
      } catch (e) { toast('Datei konnte nicht gelesen werden'); }
    };
    rd.readAsText(f);
  },
};
const I = {
  mixVol(el) { P().mix[el.dataset.v].vol = +el.value; commit({ noRender:true }); },
  swing(el) { P().swing = +el.value; ['swingVal', 'swingVal2'].forEach(id => { const x = document.getElementById(id); if (x) x.textContent = Math.round(P().swing * 100) + '%'; }); commit({ noRender:true }); },
  pickText(el) {
    S.ui.pickText = el.value;
    const c = parseChord(el.value), key = keyOf(secById(S.ui.sheet.secId)), out = document.getElementById('pickParsed');
    if (out) out.innerHTML = c ? `Erkannt: <b style="color:${pcColor(c.r)}">${esc(chordSym(c))}</b> · ${esc(numeral(c, key))} · ${esc(QUALS[c.q].name)}` : (el.value ? 'Kenne ich nicht – probier z. B. Am7 oder Dsus2.' : '');
  },
};

/* ---- Drag & Drop im Ablauf ---- */
function initDrag() {
  document.addEventListener('pointerdown', e => {
    const g = e.target.closest('[data-drag]'); if (!g) return;
    e.preventDefault();
    const from = +g.dataset.drag, item = g.closest('.ai'), arr = document.getElementById('arr');
    const r = item.getBoundingClientRect(), ghost = item.cloneNode(true);
    ghost.classList.add('ghost'); ghost.style.width = r.width + 'px'; document.body.appendChild(ghost);
    const offX = e.clientX - r.left, offY = e.clientY - r.top;
    item.classList.add('dragging');
    let to = from;
    const move = ev => {
      ghost.style.left = (ev.clientX - offX) + 'px'; ghost.style.top = (ev.clientY - offY) + 'px';
      const items = [...arr.querySelectorAll('.ai:not(.add)')];
      let best = from, bd = 1e9;
      items.forEach((it, i) => { const rr = it.getBoundingClientRect(); const d = Math.hypot(ev.clientX - (rr.left + rr.width / 2), (ev.clientY - (rr.top + rr.height / 2)) * 2); if (d < bd) { bd = d; best = i; } });
      to = best; items.forEach((it, i) => it.classList.toggle('drop', i === to && to !== from));
    };
    const up = () => {
      document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up); document.removeEventListener('pointercancel', up);
      ghost.remove();
      if (to !== from) { const a = P().arrangement; const [x] = a.splice(from, 1); a.splice(to, 0, x); commit(); } else render();
    };
    move(e);
    document.addEventListener('pointermove', move); document.addEventListener('pointerup', up); document.addEventListener('pointercancel', up);
  });
}

  loadStore();
  if (!store.projects.length) store.projects.push(projectFromGen(generateSong('melancholisch', 9, 7), 'Mein erster Song'));
  S.proj = store.projects.find(p => p.id === store.currentId) || store.projects[0];
  store.currentId = S.proj.id;
  S.ui.secId = S.proj.sections[0] ? S.proj.sections[0].id : null;
  PL.onStop = () => render();
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-a]'); if (!el) return;
    if (el.tagName === 'INPUT' || el.tagName === 'SELECT' || el.tagName === 'TEXTAREA') return;
    const fn = A[el.dataset.a];
    if (fn) fn(el, e);
  });
  document.addEventListener('change', e => { const el = e.target.closest('[data-a]'); if (!el) return; const fn = C[el.dataset.a]; if (fn) fn(el, e); });
  document.addEventListener('input', e => { const el = e.target.closest('[data-a]'); if (!el) return; const fn = I[el.dataset.a]; if (fn) fn(el, e); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.id === 'pickText') A.pickTyped();
    if (e.key === 'Escape' && S.ui.sheet) closeSheet();
  });
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); window._installEvt = e; if (S.ui.sheet && S.ui.sheet.type === 'lib') render(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });
  initDrag();
  render();
  window.__back = () => { if (S.ui.sheet) { closeSheet(); return true; } if (S.ui.tab !== 'song') { S.ui.tab = 'song'; render(); return true; } return false; };
  if ('serviceWorker' in navigator && location.protocol === 'https:' && !inClaude() && !window.AndroidBridge) navigator.serviceWorker.register('sw.js').catch(() => {});
}
document.addEventListener('DOMContentLoaded', init);
