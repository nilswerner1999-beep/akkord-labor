name: Android-APK bauen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Web-App in die APK kopieren
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html manifest.webmanifest icon-192.png icon-512.png android/app/src/main/assets/www/
      - name: APK bauen
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/release/app-release.apk Akkord-Labor.apk
      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Akkord-Labor ${{ github.run_number }}
          body: Android-App (APK). Herunterladen, öffnen, Installation aus unbekannter Quelle erlauben.
          files: Akkord-Labor.apk
          make_latest: true
